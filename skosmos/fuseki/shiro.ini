# Local Compose defaults bind the Fuseki and Varnish ports to 127.0.0.1.
[main]
ssl.enabled = false
localhostFilter = org.apache.jena.fuseki.authz.LocalhostFilter

[urls]
/$/status = anon
/$/server = anon
/$/ping = anon
/$/metrics = anon
# The query page reads dataset statistics during navigation.
/$/stats = anon
/$/stats/** = anon
/$/** = localhostFilter
/** = anon

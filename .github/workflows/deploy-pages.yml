name: Publish SoilVoc viewer

on:
  push:
    branches: [main]
    paths:
      - 'viewer/**'
      - 'SoilVoc.ttl'
      - 'SoilVoc_augmented.ttl'
      - 'SoilVoc_concepts.csv'
      - 'CITATION.cff'
      - 'LICENSE'
      - '.github/workflows/deploy-pages.yml'
  pull_request:
    paths:
      - 'viewer/**'
      - 'SoilVoc.ttl'
      - 'SoilVoc_augmented.ttl'
      - 'SoilVoc_concepts.csv'
      - 'CITATION.cff'
      - 'LICENSE'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: npm ci
      - run: npm run build -- --base=/soil-vocabs/
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: viewer/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/deploy-pages@v5
        id: deployment
